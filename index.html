<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stickman Walk</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      font-family: system-ui, sans-serif;
    }
    .game {
      width: min(900px, 96vw);
      text-align: center;
    }
    h1 { margin: 0 0 12px; }
    p { color: #cbd5e1; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 3px solid #334155;
      border-radius: 12px;
      background: #bae6fd;
      touch-action: none;
    }
    kbd {
      padding: 2px 7px;
      border: 1px solid #64748b;
      border-radius: 5px;
      background: #1e293b;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>Stickman Walk</h1>
    <canvas id="game" width="900" height="500" aria-label="A game where you can walk a stickman"></canvas>
    <p>Move with <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd>. Press <kbd>Space</kbd> to jump.</p>
  </main>

  <script>
    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');

    const keys = new Set();
    const player = {
      x: canvas.width / 2,
      y: 380,
      width: 34,
      height: 90,
      speed: 260,
      jumpPower: 520,
      velocityY: 0,
      grounded: true,
      walkTime: 0
    };

    const groundY = 430;
    let previousTime = performance.now();

    addEventListener('keydown', (event) => {
      keys.add(event.key.toLowerCase());
      if (['arrowleft', 'arrowright', 'a', 'd', ' '].includes(event.key.toLowerCase())) {
        event.preventDefault();
      }
      if ((event.key === ' ' || event.key.toLowerCase() === 'w' || event.key === 'arrowup') && player.grounded) {
        player.velocityY = -player.jumpPower;
        player.grounded = false;
      }
    });

    addEventListener('keyup', (event) => keys.delete(event.key.toLowerCase()));

    function update(delta) {
      const movingLeft = keys.has('arrowleft') || keys.has('a');
      const movingRight = keys.has('arrowright') || keys.has('d');
      const direction = Number(movingRight) - Number(movingLeft);

      player.x += direction * player.speed * delta;
      player.x = Math.max(player.width / 2, Math.min(canvas.width - player.width / 2, player.x));
      player.walkTime += direction * delta * 10;

      player.velocityY += 1200 * delta;
      player.y += player.velocityY * delta;
      if (player.y >= groundY - player.height) {
        player.y = groundY - player.height;
        player.velocityY = 0;
        player.grounded = true;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Sky and simple scenery.
      ctx.fillStyle = '#bae6fd';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#86efac';
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(0, groundY, canvas.width, 8);
      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.arc(760, 90, 42, 0, Math.PI * 2);
      ctx.fill();

      // Shadow.
      ctx.fillStyle = 'rgba(15, 23, 42, 0.2)';
      ctx.beginPath();
      ctx.ellipse(player.x, groundY + 2, 30, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      drawStickman();
    }

    function drawStickman() {
      const x = player.x;
      const top = player.y;
      const walking = keys.has('arrowleft') || keys.has('arrowright') || keys.has('a') || keys.has('d');
      const swing = walking && player.grounded ? Math.sin(player.walkTime) * 18 : 0;
      const bob = walking && player.grounded ? Math.abs(Math.sin(player.walkTime)) * 2 : 0;
      const headY = top + 16 - bob;
      const shoulderY = top + 38 - bob;
      const hipY = top + 66 - bob;

      ctx.strokeStyle = '#111827';
      ctx.fillStyle = '#f8fafc';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Head.
      ctx.beginPath();
      ctx.arc(x, headY, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Body.
      ctx.beginPath();
      ctx.moveTo(x, shoulderY);
      ctx.lineTo(x, hipY);
      ctx.stroke();

      // Arms swing opposite to the legs.
      ctx.beginPath();
      ctx.moveTo(x, shoulderY + 3);
      ctx.lineTo(x - 25, shoulderY + 27 + swing);
      ctx.moveTo(x, shoulderY + 3);
      ctx.lineTo(x + 25, shoulderY + 27 - swing);
      ctx.stroke();

      // Legs swing while walking.
      ctx.beginPath();
      ctx.moveTo(x, hipY);
      ctx.lineTo(x - 21 + swing, top + player.height);
      ctx.moveTo(x, hipY);
      ctx.lineTo(x + 21 - swing, top + player.height);
      ctx.stroke();
    }

    function gameLoop(time) {
      const delta = Math.min((time - previousTime) / 1000, 0.05);
      previousTime = time;
      update(delta);
      draw();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
